<style>
:root{
  --page:#e6e3d0; --case:#bdbb93; --case-l:#d6d4b0; --case-d:#8e8b66; --ink:#1d1d14; --key-txt:#1d1d14;
  --screen:#0a1034; --txt:#e8e5c6; --dim:#9aa0c8; --pink:#ff2d87; --line:#2a3470;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#14150d;--case:#5c5b44;--case-l:#757458;--case-d:#363524;--ink:#0f0f09;--key-txt:#f2efe0;color-scheme:dark}
}
:root[data-theme="dark"]{--page:#14150d;--case:#5c5b44;--case-l:#757458;--case-d:#363524;--ink:#0f0f09;--key-txt:#f2efe0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font:400 14px/1.6 "IBM Plex Mono",ui-monospace,Menlo,monospace}
.pc{max-width:960px;margin:0 auto;padding:28px 16px 48px}
.monitor{background:var(--case);border:2px solid var(--ink);border-radius:22px 22px 10px 10px;padding:22px 22px 12px;box-shadow:inset 0 -8px 0 var(--case-d),6px 6px 0 var(--ink)}
.screen{position:relative;background:var(--screen);color:var(--txt);border:3px solid var(--ink);border-radius:10px;min-height:520px;padding:24px 28px 28px;box-shadow:inset 0 0 60px rgba(0,0,0,.55);overflow:hidden}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.screen.no-scan::after{display:none}
.strip{display:flex;align-items:center;gap:10px;padding:10px 4px 0;font:16px "VT323",monospace;letter-spacing:.06em;color:var(--key-txt)}
.led{width:10px;height:10px;border-radius:50%;background:#35d05a;box-shadow:0 0 6px #35d05a}
.strip .sp{flex:1}
.knob{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;background:var(--case-l);color:var(--key-txt);border:2px solid var(--ink);font:15px "VT323",monospace;user-select:none}
.knob:hover{filter:brightness(1.08)}
.knob:active{transform:translateY(1px)}
.knob:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
a{color:var(--pink);text-underline-offset:3px}a:hover{color:#fff}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.screen h1{font:400 clamp(38px,7vw,64px)/.95 "VT323",monospace;margin:6px 0 4px;color:#fff;letter-spacing:.02em}
.screen h2{font:400 30px/1 "VT323",monospace;margin:0 0 16px;color:var(--pink)}
.prompt{font:20px "VT323",monospace;color:var(--dim);margin:0}
.role{font:22px/1.2 "VT323",monospace;color:var(--txt);margin:0 0 18px}
.cur{display:inline-block;width:10px;height:.75em;background:var(--pink);vertical-align:-.08em;margin-left:6px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.boot{font:20px/1.4 "VT323",monospace;color:var(--txt);margin:0;white-space:pre-wrap}
.boot .okt{color:#35d05a}
.boot-skip{margin-top:18px;font:17px "VT323",monospace;color:var(--dim)}
.widgets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.w{border:1px solid var(--line);background:rgba(255,255,255,.03);padding:12px 14px}
.w b{display:block;font:18px "VT323",monospace;color:var(--dim);font-weight:400;margin-bottom:2px}
.w .big{font:34px/1 "VT323",monospace;color:#fff}
.w small{color:var(--dim);display:block;font-size:12px}
.ok{display:inline-block;width:9px;height:9px;border-radius:50%;background:#35d05a;margin-right:8px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.quick .btn{margin:0;padding:2px 12px;font-size:18px}
.term{border:1px solid var(--line);padding:12px 14px;font:19px/1.3 "VT323",monospace;min-height:150px;max-height:215px;overflow-y:auto;cursor:text}
.term pre{margin:0 0 6px;white-space:pre-wrap;font:inherit;color:var(--txt)}
.term-in{display:flex;align-items:center;gap:6px}
.term label{color:var(--pink);flex:0 0 auto}
.term input{all:unset;color:#fff;flex:1;min-width:0;caret-color:var(--pink)}
.screen p{max-width:64ch;margin:0 0 12px}
details{border:1px solid var(--line);margin-bottom:10px;background:rgba(255,255,255,.03)}
summary{cursor:pointer;padding:10px 14px;font:22px "VT323",monospace;list-style:none;color:#fff}
summary::-webkit-details-marker{display:none}
summary::before{content:"> ";color:var(--pink)}details[open] summary::before{content:"v ";color:var(--pink)}
details>div{padding:0 14px 12px}
.arch{margin:10px 0;padding:10px 12px;border:1px dashed var(--line);background:rgba(0,0,0,.28);color:var(--dim);font:12px/1.35 "IBM Plex Mono",monospace;overflow-x:auto;white-space:pre}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tags span{border:1px solid var(--pink);color:var(--pink);padding:0 8px;font-size:12px}
.row{display:grid;grid-template-columns:200px 1fr;gap:4px 18px;padding:10px 0;border-bottom:1px solid var(--line)}
.row dt{font:20px "VT323",monospace;color:var(--pink)}.row dd{margin:0}
.btn{display:inline-block;margin:6px 10px 0 0;padding:4px 16px;border:2px solid var(--pink);background:transparent;color:var(--pink);text-decoration:none;font:20px "VT323",monospace;cursor:pointer}
.btn:hover{background:var(--pink);color:var(--screen)}
.mail-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}
.mail-row .btn{margin:0;padding:1px 12px;font-size:18px}
/* keyboard */
.deck{margin-top:18px;background:var(--case);border:2px solid var(--ink);border-radius:12px 12px 22px 22px;padding:16px;box-shadow:inset 0 -8px 0 var(--case-d),6px 6px 0 var(--ink)}
.fkeys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px}
.k{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;background:var(--case-l);color:var(--key-txt);border:1px solid var(--ink);border-radius:6px;box-shadow:0 4px 0 var(--case-d);font:20px/1 "VT323",monospace;padding:9px 2px;user-select:none}
.k:active{transform:translateY(3px);box-shadow:0 1px 0 var(--case-d)}
.k:focus-visible{outline:3px solid var(--pink)}
.k.f{background:var(--pink);color:#fff;font-size:19px}
.k.f[aria-current="page"]{background:var(--ink);color:var(--pink)}
.kb{display:flex;flex-direction:column;gap:7px}
.krow{display:flex;gap:6px;justify-content:center}
.krow .k{flex:1;min-width:0}
.krow .k.wide{flex:2.2}
.krow .k.space{flex:4}
noscript{display:block;max-width:720px;margin:24px auto;padding:20px;border:2px solid var(--ink);background:var(--screen);color:var(--txt)}
@media (max-width:700px){
  .screen{padding:18px 16px 22px;min-height:440px}.monitor{padding:14px 14px 8px}
  .widgets{grid-template-columns:1fr}.row{grid-template-columns:1fr}
  .fkeys{grid-template-columns:repeat(3,1fr)}.k{font-size:17px;padding:8px 1px}
}
@media (prefers-reduced-motion:reduce){.cur{animation:none}.k{transition:none}}
</style>
</head>

    "cv en":()=>dl("CarmenCrespoEN.pdf"),
    "cv es":()=>dl("CarmenCrespoCVES.pdf"),
    contact:()=>"Email: "+A("mailto:"+D.email,D.email)+"\nLocation: Spain\nGitHub: "+A(D.gh)+"\nLinkedIn: "+A(D.li),
    github:()=>A(D.gh),
    linkedin:()=>A(D.li)
  };

  inp.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"){run();return}
    if(ev.key==="ArrowUp"&&hist.length){
      ev.preventDefault();
      hIdx=Math.min(hIdx+1,hist.length-1);
      inp.value=hist[hist.length-1-hIdx];
    }else if(ev.key==="ArrowDown"){
      ev.preventDefault();
      hIdx=Math.max(hIdx-1,-1);
      inp.value=hIdx===-1?"":hist[hist.length-1-hIdx];
    }
  });

  window.run=()=>{
    const raw=inp.value.trim().replace(/\s+/g," ");
    const q=raw.toLowerCase();
    inp.value="";hIdx=-1;
    if(q)hist.push(raw);
    if(q==="clear"){out.innerHTML="";return}

    let res="";
    if(!q){res=""}
    else if(R[q]){res=R[q]()}
    else if(q.startsWith("ask ")){
      const topic=q.slice(4).trim();
      res=ASK[topic]||"Unknown topic: "+e(topic)+". Try: "+Object.keys(ASK).join(", ");
    }else if(q.startsWith("submit ")){
      const fl=raw.slice(7).trim();
      if(FLAGS.has(fl)){
        found.add(fl);
        res=found.size===FLAGS.size
          ?"Flag accepted! ("+found.size+"/"+FLAGS.size+") — You pwned the portfolio. Let's talk on "+A(D.li,"LinkedIn")+"!"
          :"Flag accepted! ("+found.size+"/"+FLAGS.size+" found)";
      }else{
        res="Invalid flag. Keep digging!";
      }
    }else if(q.startsWith("sudo")){
      res="carmen is not in the sudoers file. This incident will be reported.";
    }else if(q.startsWith("base64 -d ")){
      const b64=raw.slice(10).trim();
      try{res=e(atob(b64))}catch{res="base64: invalid input"}
    }else{
      res="Unknown command: "+e(q)+". Type help";
    }

    out.innerHTML+="\nA:\\> "+e(raw)+"\n"+res;
    term.scrollTop=term.scrollHeight;
  };
}

// BIOS Boot Sequence (once per session, skippable)
function boot(force){
  let seen=false;
  try{seen=sessionStorage.getItem("booted")==="1"}catch{}
  if(!force&&(seen||matchMedia("(prefers-reduced-motion:reduce)").matches)){show();return}

  const lines=[
    "CARMEN-BIOS v2.6 (C) 2026",
    "Checking memory... 640K <span class=\"okt\">OK</span>",
    "Loading RAG_modules & LangGraph... <span class=\"okt\">OK</span>",
    "Mounting /dev/cloud (AWS, Docker)... <span class=\"okt\">OK</span>",
    "Starting carmen_crespo.exe..."
  ];
  let idx=0,done=false;
  scr.innerHTML=`<pre class="boot" id="boot-log"></pre><p class="boot-skip">Press any key or click to skip...</p>`;
  const log=document.getElementById("boot-log");

  const finish=()=>{
    if(done)return;
    done=true;
    clearInterval(bt);
    removeEventListener("keydown",finish);
    scr.removeEventListener("click",finish);
    try{sessionStorage.setItem("booted","1")}catch{}
    show();
  };

  addEventListener("keydown",finish);
  scr.addEventListener("click",finish);

  const bt=setInterval(()=>{
    if(idx<lines.length){
      log.innerHTML+=(idx?"\n":"")+lines[idx++];
    }else{
      setTimeout(finish,220);
      clearInterval(bt);
    }
  },180);
}

// QWERTY on-screen keyboard
const kb=document.getElementById("kb");
const ROWS=[
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["Z","X","C","V","B","N","M","DEL"],
  ["SPACE","ENTER"]
];
kb.innerHTML=ROWS.map(r=>`<div class="krow">${r.map(k=>{
  const c=k==="SPACE"?" ":k.toLowerCase();
  const cls=k==="SPACE"?"k space":k==="ENTER"?"k wide f":k==="DEL"?"k wide":"k";
  return `<button class="${cls}" type="button" data-c="${c}">${k}</button>`;
}).join("")}</div>`).join("");

kb.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const c=b.dataset.c;
  const apply=i=>{
    if(c==="del")i.value=i.value.slice(0,-1);
    else if(c==="enter")window.run();
    else i.value+=c;
    i.focus();
  };
  let i=document.getElementById("cmd");
  if(!i){
    location.hash="home";
    requestAnimationFrame(()=>{const ni=document.getElementById("cmd");if(ni)apply(ni)});
    return;
  }
  apply(i);
});

addEventListener("hashchange",show);
boot(false);
</script>
